// ── K-Means Clustering ─────────────────────────────────────────────
function kMeans(positions, k, maxIter = 50) {
  const n = positions.length;
  if (n === 0) return { assignments: [], centers: [] };
  k = Math.min(k, n);
  // Initialize centers using k-means++
  const centers = [];
  centers.push([...positions[0]]);
  for (let c = 1; c < k; c++) {
    const dists = positions.map(p => {
      let minD = Infinity;
      centers.forEach(cent => {
        const dx = p[0]-cent[0], dy = p[1]-cent[1], dz = p[2]-cent[2];
        minD = Math.min(minD, dx*dx+dy*dy+dz*dz);
      });
      return minD;
    });
    const total = dists.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < n; i++) {
      r -= dists[i];
      if (r <= 0) { centers.push([...positions[i]]); break; }
    }
    if (centers.length <= c) centers.push([...positions[Math.floor(Math.random()*n)]]);
  }
  let assignments = new Array(n).fill(0);
  for (let iter = 0; iter < maxIter; iter++) {
    // Assign
    let changed = false;
    for (let i = 0; i < n; i++) {
      let best = 0, bestD = Infinity;
      for (let c = 0; c < k; c++) {
        const dx = positions[i][0]-centers[c][0], dy = positions[i][1]-centers[c][1], dz = positions[i][2]-centers[c][2];
        const d = dx*dx+dy*dy+dz*dz;
        if (d < bestD) { bestD = d; best = c; }
      }
      if (assignments[i] !== best) { changed = true; assignments[i] = best; }
    }
    if (!changed) break;
    // Update centers
    for (let c = 0; c < k; c++) {
      const members = positions.filter((_, i) => assignments[i] === c);
      if (members.length === 0) continue;
      centers[c] = [
        members.reduce((s, p) => s + p[0], 0) / members.length,
        members.reduce((s, p) => s + p[1], 0) / members.length,
        members.reduce((s, p) => s + p[2], 0) / members.length,
      ];
    }
  }
  return { assignments, centers };
}

// ── Convex Hull Wireframe (approximate sphere per cluster) ──────────
function buildClusterHulls(positions, assignments, centers) {
  clusterHulls.forEach(h => scene.remove(h.mesh));
  clusterHulls = [];
  const k = centers.length;
  for (let c = 0; c < k; c++) {
    const members = positions.filter((_, i) => assignments[i] === c);
    if (members.length < 2) continue;
    // Compute bounding sphere
    const cx = centers[c][0], cy = centers[c][1], cz = centers[c][2];
    let maxR = 0;
    members.forEach(p => {
      const d = Math.sqrt((p[0]-cx)**2 + (p[1]-cy)**2 + (p[2]-cz)**2);
      if (d > maxR) maxR = d;
    });
    maxR += 2.0; // padding
    const color = new THREE.Color(CLUSTER_COLORS[c % CLUSTER_COLORS.length]);
    // Wireframe sphere
    const geo = new THREE.SphereGeometry(maxR, 16, 12);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.04, wireframe: true, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(cx, cy, cz);
    scene.add(mesh);
    clusterHulls.push({ mesh, clusterId: c, center: centers[c], radius: maxR, color });
  }
}

// ── Rebuild edges at a given threshold (without re-fetching) ────────
function rebuildEdges(data, threshold) {
  edgeLines.forEach(l => scene.remove(l));
  particles.forEach(p => scene.remove(p.mesh));
  edgeLines = []; particles = [];
  if (!data) return;
  const { nodes, edges } = data;
  const filtered = edges.filter(e => e.similarity >= threshold);
  filtered.forEach(edge => {
    const src = nodes[edge.source], tgt = nodes[edge.target];
    if (!src || !tgt) return;
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...src.position), new THREE.Vector3(...tgt.position)]);
    const c1 = new THREE.Color(src.color), c2 = new THREE.Color(tgt.color);
    const blended = c1.clone().lerp(c2, 0.5);
    const opacity = EDGE_BASE_OPACITY + edge.similarity * 0.35;
    const mat = new THREE.LineBasicMaterial({ color: blended, transparent: true, opacity });
    const line = new THREE.Line(geo, mat);
    line.userData = { edge, sourceIdx: edge.source, targetIdx: edge.target };
    scene.add(line);
    edgeLines.push(line);
    // Particle
    const pGeo = new THREE.SphereGeometry(0.05, 6, 6);
    const pMat = new THREE.MeshBasicMaterial({ color: blended, transparent: true, opacity: 0.7 });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    scene.add(pMesh);
    particles.push({
      mesh: pMesh,
      source: new THREE.Vector3(...src.position),
      target: new THREE.Vector3(...tgt.position),
      t: Math.random(),
      speed: PARTICLE_SPEED * (0.5 + Math.random()),
      edge
    });
  });
  document.getElementById('edge-count').textContent = `${filtered.length} edges`;
}

  const { nodes, edges } = data;

  document.getElementById('node-count').textContent = `${nodes.length} nodes`;
  document.getElementById('edge-count').textContent = `${edges.length} edges`;
  if (edges.length > 0) {
    const sims = edges.map(e => e.similarity);
    document.getElementById('sim-range').textContent = `sim: ${Math.min(...sims).toFixed(3)}–${Math.max(...sims).toFixed(3)}`;
  }

  // ── K-means clustering ──
  const positions = nodes.map(n => n.position);
  const numClusters = Math.max(2, Math.min(Math.ceil(nodes.length / 4), 8));
  const { assignments, centers } = kMeans(positions, numClusters);
  clusterAssignments = assignments;
  clusterCenters = centers;
  document.getElementById('cluster-count').textContent = `${centers.length} clusters`;

  // Cluster legend
  const clEl = document.getElementById('cluster-list');
  clEl.innerHTML = '';
  centers.forEach((c, i) => {
    const count = assignments.filter(a => a === i).length;
    const col = '#' + new THREE.Color(CLUSTER_COLORS[i % CLUSTER_COLORS.length]).getHexString();
    clEl.innerHTML += `<div><span class="swatch" style="background:${col}"></span>Cluster ${i+1} (${count})</div>`;
  });

  // ── Nodes ──
  nodes.forEach((node, i) => {
    const color = new THREE.Color(node.color);
    const geo = new THREE.SphereGeometry(NODE_BASE_SIZE, 24, 24);
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: 0.5,
      roughness: 0.3, metalness: 0.7, transparent: true, opacity: animate ? 0 : 0.9,
    });
    const mesh = new THREE.Mesh(geo, mat);
    if (animate) {
      mesh.scale.setScalar(0.01);
      entryAnimations.set(i, { scale: 0.01, targetScale: 1.0, delay: i * 0.03 });
    } else {
      mesh.scale.setScalar(1);
    }
    mesh.position.set(...node.position);
    mesh.userData = { node, index: i };
    scene.add(mesh);
    nodeMeshes.push(mesh);

    // Glow
    const glowGeo = new THREE.SphereGeometry(NODE_BASE_SIZE * 1.8, 12, 12);
    const glowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.06, side: THREE.BackSide });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    mesh.add(glow);
    mesh.userData.glow = glow;
    velocityMap.set(i, new THREE.Vector3(0, 0, 0));

    // Label sprite (hidden by default)
    const canvas2 = document.createElement('canvas');
    const ctx = canvas2.getContext('2d');
    canvas2.width = 256; canvas2.height = 64;
    ctx.fillStyle = 'white';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(node.key.slice(0, 18), 128, 40);
    const tex = new THREE.CanvasTexture(canvas2);
    const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0 });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.set(node.position[0], node.position[1] + 0.8, node.position[2]);
    sprite.scale.set(4, 1, 1);
    scene.add(sprite);
    labelSprites.push(sprite);
  });

  rebuildEdges(data, currentThreshold);
  buildClusterHulls(positions, assignments, centers);

  document.getElementById('loading').style.display = 'none';
}

// ── Force-directed layout ───────────────────────────────────────────
function applyForces() {
  if (!forceEnabled || !graphData) return;
  const { edges } = graphData;
  const n = nodeMeshes.length;
  for (let i = 0; i < n; i++) {
    const vi = velocityMap.get(i), pi = nodeMeshes[i].position;
    for (let j = i + 1; j < n; j++) {
      const pj = nodeMeshes[j].position;
      const dx = pi.x-pj.x, dy = pi.y-pj.y, dz = pi.z-pj.z;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.01;
      const force = FORCE_REPULSION / (dist * dist);
      const f = force / dist;
      vi.x += dx*f; vi.y += dy*f; vi.z += dz*f;
      const vj = velocityMap.get(j);
      vj.x -= dx*f; vj.y -= dy*f; vj.z -= dz*f;
    }
  }
  edges.forEach(e => {
    const pi = nodeMeshes[e.source]?.position, pj = nodeMeshes[e.target]?.position;
    if (!pi || !pj) return;
    const dx = pj.x-pi.x, dy = pj.y-pi.y, dz = pj.z-pi.z;
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.01;
    const force = (dist - 3) * FORCE_STRENGTH * e.similarity;
    const f = force / dist;
    velocityMap.get(e.source).x += dx*f; velocityMap.get(e.source).y += dy*f; velocityMap.get(e.source).z += dz*f;
    velocityMap.get(e.target).x -= dx*f; velocityMap.get(e.target).y -= dy*f; velocityMap.get(e.target).z -= dz*f;
  });
  for (let i = 0; i < n; i++) {
    const vi = velocityMap.get(i), pi = nodeMeshes[i].position;
    vi.x -= pi.x * 0.0008; vi.y -= pi.y * 0.0008; vi.z -= pi.z * 0.0008;
    pi.x += vi.x; pi.y += vi.y; pi.z += vi.z;
    vi.multiplyScalar(DAMPING);
  }
  // Update edges + particles
  edgeLines.forEach(l => {
    const sp = nodeMeshes[l.userData.sourceIdx].position, tp = nodeMeshes[l.userData.targetIdx].position;
    const pos = l.geometry.attributes.position;
    pos.setXYZ(0, sp.x, sp.y, sp.z); pos.setXYZ(1, tp.x, tp.y, tp.z); pos.needsUpdate = true;
  });
  particles.forEach(p => {
    p.source.copy(nodeMeshes[p.edge.source].position);
    p.target.copy(nodeMeshes[p.edge.target].position);
  });
}

// ── Node Drag ───────────────────────────────────────────────────────
function onPointerDown(e) {
  if (e.button !== 0) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length > 0) {
    isDraggingNode = true;
    dragNode = hits[0].object;
    controls.enabled = false;
    // Set drag plane perpendicular to camera
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), dragNode.position);
    const intersection = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, intersection);
    dragOffset.copy(dragNode.position).sub(intersection);
  }
}
function onPointerMove(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  if (isDraggingNode && dragNode) {
    raycaster.setFromCamera(mouse, camera);
    const intersection = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, intersection);
    if (intersection) {
      dragNode.position.copy(intersection.add(dragOffset));
      // Update connected edges
      edgeLines.forEach(l => {
        if (l.userData.sourceIdx === dragNode.userData.index || l.userData.targetIdx === dragNode.userData.index) {
          const sp = nodeMeshes[l.userData.sourceIdx].position, tp = nodeMeshes[l.userData.targetIdx].position;
          const pos = l.geometry.attributes.position;
          pos.setXYZ(0, sp.x, sp.y, sp.z); pos.setXYZ(1, tp.x, tp.y, tp.z); pos.needsUpdate = true;
        }
      });
    }
    return;
  }
  // Hover detection
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeMeshes);
  const tooltip = document.getElementById('tooltip');
  if (intersects.length > 0) {
    const hit = intersects[0].object, node = hit.userData.node;
    if (hoveredNode !== hit) {
      resetHighlight();
      hoveredNode = hit;
      hit.scale.setScalar(NODE_HOVER_SIZE / NODE_BASE_SIZE);
      hit.material.emissiveIntensity = 1.2;
      hit.userData.glow.material.opacity = 0.25;
      highlightConnections(hit.userData.index);
    }
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.querySelector('.tt-key').textContent = node.key || '(no key)';
    tooltip.querySelector('.tt-content').textContent = node.content;
    tooltip.querySelector('.tt-meta').textContent = `kind: ${node.kind} · source: ${node.source || '—'} · cluster: ${(clusterAssignments[hit.userData.index]||0)+1}`;
  } else {
    if (hoveredNode) { resetHighlight(); hoveredNode = null; }
    tooltip.style.display = 'none';
  }
}
function onPointerUp() {
  if (isDraggingNode) {
    isDraggingNode = false; dragNode = null;
    controls.enabled = true;
  }
}
function highlightConnections(idx) {
  edgeLines.forEach(l => {
    if (l.userData.sourceIdx === idx || l.userData.targetIdx === idx) {
      l.material.opacity = EDGE_HIGHLIGHT_OPACITY;
      l.userData._hl = true;
    } else {
      l.material.opacity *= 0.2;
      l.userData._dimmed = true;
    }
  });
  nodeMeshes.forEach((m, i) => {
    if (i !== idx) {
      const connected = edgeLines.some(l => l.userData._hl && (l.userData.sourceIdx === i || l.userData.targetIdx === i));
      if (!connected) { m.material.opacity = 0.15; m.userData._dimmed = true; }
    }
  });
}
function resetHighlight() {
  edgeLines.forEach(l => {
    if (l.userData._hl) { l.material.opacity = EDGE_BASE_OPACITY + l.userData.edge.similarity * 0.35; l.userData._hl = false; }
    if (l.userData._dimmed) { l.material.opacity = EDGE_BASE_OPACITY + l.userData.edge.similarity * 0.35; l.userData._dimmed = false; }
  });
  nodeMeshes.forEach(m => {
    if (m.userData._dimmed) { m.material.opacity = 0.9; m.userData._dimmed = false; }
    if (m !== hoveredNode && m !== focusedNode) {
      m.scale.setScalar(1);
      m.material.emissiveIntensity = 0.5;
      if (m.userData.glow) m.userData.glow.material.opacity = 0.06;
    }
  });
}

// ── Click to Focus ──────────────────────────────────────────────────
function onClick(e) {
  if (isDraggingNode) return;
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length > 0) {
    focusNode(hits[0].object);
  } else {
    unfocusNode();
  }
}
function focusNode(mesh) {
  focusedNode = mesh;
  const node = mesh.userData.node, idx = mesh.userData.index;
  // Zoom camera toward node
  const target = mesh.position.clone();
  const dir = camera.position.clone().sub(target).normalize();
  const newPos = target.clone().add(dir.multiplyScalar(8));
  animateCamera(newPos, target);
  // Highlight
  resetHighlight();
  mesh.scale.setScalar(NODE_HOVER_SIZE / NODE_BASE_SIZE * 1.2);
  mesh.material.emissiveIntensity = 1.5;
  mesh.userData.glow.material.opacity = 0.35;
  highlightConnections(idx);
  // Show panel
  const panel = document.getElementById('focused-panel');
  panel.style.display = 'block';
  panel.querySelector('.fp-key').textContent = node.key;
  panel.querySelector('.fp-content').textContent = node.content;
  panel.querySelector('.fp-meta').textContent = `kind: ${node.kind} · source: ${node.source || '—'} · cluster: ${(clusterAssignments[idx]||0)+1}`;
  // List connections
  const connList = panel.querySelector('.fp-conn-list');
  connList.innerHTML = '';
  edgeLines.filter(l => l.userData.sourceIdx === idx || l.userData.targetIdx === idx)
    .sort((a, b) => b.userData.edge.similarity - a.userData.edge.similarity)
    .slice(0, 8)
    .forEach(l => {
      const otherIdx = l.userData.sourceIdx === idx ? l.userData.targetIdx : l.userData.sourceIdx;
      const other = graphData.nodes[otherIdx];
      connList.innerHTML += `<div class="fp-conn-item">${other.key} <span style="color:#8b949e">(${l.userData.edge.similarity.toFixed(3)})</span></div>`;
    });
}
window.unfocusNode = () => {
  focusedNode = null;
  document.getElementById('focused-panel').style.display = 'none';
  resetHighlight();
  animateCamera(new THREE.Vector3(0, 10, 30), new THREE.Vector3(0, 0, 0));
};
function animateCamera(targetPos, targetLookAt) {
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const duration = 800;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startTarget, targetLookAt, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ── Search ──────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  searchMatches.clear();
  if (!q || !graphData) {
    nodeMeshes.forEach(m => { m.material.opacity = 0.9; m.userData._dimmed = false; });
    return;
  }
  graphData.nodes.forEach((n, i) => {
    if (n.key.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)) searchMatches.add(i);
  });
  nodeMeshes.forEach((m, i) => {
    if (searchMatches.has(i)) {
      m.scale.setScalar(NODE_HOVER_SIZE / NODE_BASE_SIZE);
      m.material.emissiveIntensity = 1.2;
      m.material.opacity = 1.0;
      m.userData.glow.material.opacity = 0.2;
    } else {
      m.scale.setScalar(0.6);
      m.material.opacity = 0.1;
      m.material.emissiveIntensity = 0.1;
    }
  });
  edgeLines.forEach(l => {
    const hl = searchMatches.has(l.userData.sourceIdx) || searchMatches.has(l.userData.targetIdx);
    l.material.opacity = hl ? 0.6 : 0.02;
  });
});

// ── Edge Threshold Slider ───────────────────────────────────────────
const edgeSlider = document.getElementById('edge-slider');
const edgeVal = document.getElementById('edge-val');
edgeSlider.addEventListener('input', (e) => {
  currentThreshold = parseInt(e.target.value) / 100;
  edgeVal.textContent = currentThreshold.toFixed(2);
  if (originalData) rebuildEdges(originalData, currentThreshold);
});

// ── Timeline ────────────────────────────────────────────────────────
let auditLog = [];
async function loadAuditLog() {
  try {
    const resp = await fetch('/cartridges', { headers: API_KEY ? {'X-API-Key': API_KEY} : {} });
    // Timeline is optional — only if audit log exists
  } catch(e) {}
}
window.toggleTimeline = () => {
  const tl = document.getElementById('timeline');
  tl.style.display = tl.style.display === 'none' ? 'block' : 'none';
};

// ── Controls ────────────────────────────────────────────────────────
window.toggleAutoRotate = () => { controls.autoRotate = !controls.autoRotate; document.getElementById('btn-auto').classList.toggle('active', controls.autoRotate); };
window.resetCamera = () => { animateCamera(new THREE.Vector3(0, 10, 30), new THREE.Vector3(0, 0, 0)); };
window.toggleForce = () => { forceEnabled = !forceEnabled; document.getElementById('btn-force').classList.toggle('active', forceEnabled); };
window.toggleClusters = () => {
  clustersVisible = !clustersVisible;
  document.getElementById('btn-clusters').classList.toggle('active', clustersVisible);
  clusterHulls.forEach(h => { h.mesh.visible = clustersVisible; });
};
window.toggleLabels = () => {
  labelsVisible = !labelsVisible;
  document.getElementById('btn-labels').classList.toggle('active', labelsVisible);
  labelSprites.forEach(s => { s.material.opacity = labelsVisible ? 0.85 : 0; });
};
window.exportImage = () => {
  composer.render();
  const a = document.createElement('a'); a.download = 'sqac-graph.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click();
};

// ── Animation Loop ──────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  controls.update();

  // Entry animations (scale in with stagger)
  entryAnimations.forEach((anim, i) => {
    if (elapsed > anim.delay && anim.scale < anim.targetScale) {
      anim.scale = Math.min(anim.scale + 0.04, anim.targetScale);
      const mesh = nodeMeshes[i];
      if (mesh && mesh !== hoveredNode && mesh !== focusedNode) {
        mesh.scale.setScalar(anim.scale);
        mesh.material.opacity = Math.min(anim.scale, 0.9);
      }
    }
  });

  // Pulse nodes
  nodeMeshes.forEach((mesh, i) => {
    if (mesh === hoveredNode || mesh === focusedNode) return;
    if (entryAnimations.has(i) && entryAnimations.get(i).scale < 0.9) return;
    const pulse = 1.0 + Math.sin(elapsed * 1.8 + i * 0.7) * 0.04;
    mesh.scale.setScalar(pulse);
    if (mesh.userData.glow) {
      mesh.userData.glow.material.opacity = 0.05 + Math.sin(elapsed * 1.2 + i * 0.4) * 0.03;
    }
  });

  // Animate particles
  particles.forEach(p => {
    p.t += p.speed;
    if (p.t > 1) p.t -= 1;
    const ease = p.t < 0.5 ? 2*p.t*p.t : 1 - Math.pow(-2*p.t+2, 2)/2;
    p.mesh.position.lerpVectors(p.source, p.target, ease);
    p.mesh.material.opacity = 0.2 + Math.sin(elapsed * 3 + p.t * 10) * 0.4;
    // Pulse particle size
    const s = 0.8 + Math.sin(elapsed * 4 + p.t * 8) * 0.4;
    p.mesh.scale.setScalar(s);
  });

  // Cluster hull gentle rotation
  clusterHulls.forEach((h, i) => {
    h.mesh.rotation.y = elapsed * 0.05 + i;
    h.mesh.rotation.x = Math.sin(elapsed * 0.1 + i) * 0.1;
  });

  // Force layout
  applyForces();

  // Move lights
  pL1.position.x = Math.sin(elapsed * 0.25) * 18;
  pL1.position.z = Math.cos(elapsed * 0.25) * 18;
  pL2.position.x = Math.cos(elapsed * 0.18) * 14;
  pL2.position.z = Math.sin(elapsed * 0.18) * 14;

  composer.render();
}

// ── Resize ──────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
addEventListener('pointermove', onPointerMove);
addEventListener('pointerdown', onPointerDown);
addEventListener('pointerup', onPointerUp);
addEventListener('click', onClick);

// ── Init ────────────────────────────────────────────────────────────
const data = await fetchGraph();
buildGraph(data, true);
animate();
