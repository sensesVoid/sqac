name: Feature request
description: Suggest an idea or improvement for SQAC
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem you're trying to solve
        before the solution — that helps us evaluate alternatives.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that SQAC makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like SQAC to do. CLI/MCP/HTTP surface if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art, or examples.