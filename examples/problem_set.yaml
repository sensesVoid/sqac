# Problem Set — 50+ questions for skill-store benchmark
# Format: q (question), skill (expected skill), check (list of keywords any-of)
# A pass means the answer contains at least one keyword from the check list.
# For numeric answers, check is ["<number>"].

# ── LOGIC (15 problems) ──────────────────────────────────────────────────────

- q: "A machine fills 90 bottles in 6 minutes. At the same rate, how many minutes to fill 150 bottles?"
  skill: direct-proportion
  check: ["10"]
  domain: logic
  difficulty: easy

- q: "A pump moves 45 liters in 3 minutes. At the same rate, how many minutes for 105 liters?"
  skill: direct-proportion
  check: ["7"]
  domain: logic
  difficulty: easy

- q: "A train travels 240 km in 3 hours. At the same speed, how long to travel 400 km?"
  skill: direct-proportion
  check: ["5"]
