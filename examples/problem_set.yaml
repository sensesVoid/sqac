# ── CODING / DESIGN PATTERNS (20 problems) ──────────────────────────────────

- q: "You have an email system that needs to notify users via email, SMS, and push. The notification method depends on user preference. How should you structure this code?"
  skill: strategy-pattern
  check: ["interface", "separate", "implement", "pass", "strategy"]
  domain: coding
  difficulty: medium

- q: "You have a pricing engine where discounts are calculated differently for regular, premium, and wholesale customers. The discount type can change at runtime. What pattern solves this?"
  skill: strategy-pattern
  check: ["interface", "separate", "algorithm", "swap", "strategy"]
  domain: coding
  difficulty: medium

- q: "A spreadsheet app needs to update multiple charts whenever a cell value changes. The charts are in different parts of the UI. How do you wire this up without the cell knowing about the charts?"
