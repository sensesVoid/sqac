[package]
name = "sqac-simd"
version = "0.1.0"
edition = "2021"
description = "SIMD-accelerated XOR+popcount for SQAC fuzzy retrieval"

[lib]
name = "sqac_simd"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
target-cpu = "native"
