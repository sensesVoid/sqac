[package]
name = "sqac-simd"
version = "0.2.0"
edition = "2021"
description = "SIMD-accelerated XOR+popcount for SQAC fuzzy retrieval"

[lib]
name = "_simd"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
