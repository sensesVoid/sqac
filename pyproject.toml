[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqac"
version = "0.1.7"
description = "Symbolic Query Addressable Cartridge — hot-swappable VSA memory for LLMs"
license = "BUSL-1.1"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["memory", "vector-symbolic-architecture", "llm", "rag", "in-context-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
server = ["fastapi", "uvicorn"]
simd = ["sqac-simd"]
compress = ["lz4"]
all = ["mcp>=1.0", "fastapi", "uvicorn", "lz4"]

[project.scripts]
sqac = "sqac.cli:main"
sqac-mcp = "sqac_mcp:main"
sqac-server = "sqac.server:main"

[tool.setuptools.packages.find]
include = ["sqac*"]

[tool.setuptools]
py-modules = ["sqac_mcp"]