[package]
name = "synthquant"
version = "0.1.0"
edition = "2021"

[dependencies]
# Numerical computing
ndarray = "0.15"
rand = "0.8"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "synthquant"
path = "src/bin/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
